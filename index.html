<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"></head><body><title>Junior's Budget</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: one narrow column, one question per screen, big tap targets; results screen = banner, pie, legend, debts, sticky action bar.
   Type: Atkinson Hyperlegible (made for low-vision readers) in two weights for every role. */
:root{
  --bg:#f5f6f2; --surface:#ffffff; --fg:#1b2531; --muted:#576372; --line:#d6dbd4;
  --accent:#27599b; --accent-fg:#ffffff; --ghost:#e7ecf2;
  --green:#1f7a3d; --red:#b71c1c; --orange:#e8790c; --on-color:#ffffff;
  --x-outline:#ffffff; --x-core:#111111; --on-orange:#1b2531;
  --s1:#3a6ea5; --s2:#7b4fa3; --s3:#2a9d8f; --s4:#d4a72c; --s5:#8d6e63; --s6:#d9628f; --s7:#6c757d; --s8:#1d3557;
  --font:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121820; --surface:#1b2430; --fg:#e9eef3; --muted:#9eabb9; --line:#2d3946;
  --accent:#6aa4ec; --accent-fg:#0d1a2a; --ghost:#26323f;
  --green:#2f9a55; --red:#d03a3a; --orange:#ff9a3d;
  --s1:#6a9bd0; --s2:#a98bd0; --s3:#4cc2b3; --s4:#e6c25a; --s5:#b69a8f; --s6:#ec8db3; --s7:#98a3ad; --s8:#7f9cc8;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121820; --surface:#1b2430; --fg:#e9eef3; --muted:#9eabb9; --line:#2d3946;
  --accent:#6aa4ec; --accent-fg:#0d1a2a; --ghost:#26323f;
  --green:#2f9a55; --red:#d03a3a; --orange:#ff9a3d;
  --s1:#6a9bd0; --s2:#a98bd0; --s3:#4cc2b3; --s4:#e6c25a; --s5:#b69a8f; --s6:#ec8db3; --s7:#98a3ad; --s8:#7f9cc8;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:19px;line-height:1.45;margin:0;padding-inline:16px;padding-block:20px 0}
main{max-width:560px;margin-inline:auto;min-width:0;padding-bottom:110px}
h1{font-size:2rem;line-height:1.15;margin:0 0 .4rem;text-wrap:balance}
h2{font-size:1.6rem;line-height:1.2;margin:0 0 .5rem;text-wrap:balance}
p{margin:0 0 1rem}
.eyebrow{font-size:.85rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 .5rem;font-weight:700}
.hint{color:var(--muted);font-size:1.02rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;margin-block:0 16px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>*{flex:1 1 140px;min-width:0}
button,.btn{font:inherit;font-weight:700;min-height:58px;padding:12px 18px;border-radius:12px;border:2px solid transparent;cursor:pointer;background:var(--accent);color:var(--accent-fg);text-align:center}
button.ghost{background:var(--ghost);color:var(--fg);border-color:var(--line)}
button.green{background:var(--green);color:var(--on-color)}
button.danger{background:var(--red);color:var(--on-color)}
button.choice{text-align:left;background:var(--surface);color:var(--fg);border-color:var(--line)}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:4px solid var(--orange);outline-offset:2px}
label{display:block;font-weight:700;margin-bottom:6px}
input[type=text],input[type=number],textarea{font:inherit;width:100%;min-height:58px;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--fg)}
textarea{min-height:130px;font-size:.9rem}
.err{color:var(--red);font-weight:700;min-height:1.4em;margin:.4rem 0 .8rem}
.banner{border-radius:14px;padding:16px 18px;color:var(--on-color);font-weight:700;font-size:1.5rem;line-height:1.2;margin-bottom:14px;text-align:center}
.banner.good{background:var(--green)} .banner.bad{background:var(--red)}
.money{display:flex;justify-content:space-between;gap:12px;font-size:1.1rem;padding-block:4px;font-variant-numeric:tabular-nums}
.money b{font-weight:700}.in b{color:var(--green)}
.pie{display:block;width:100%;max-width:340px;height:auto;margin:6px auto 14px}
.legend{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.legend li{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;font-variant-numeric:tabular-nums}
.legend .sw{width:22px;height:22px;border-radius:5px}
.legend .nm{min-width:0;overflow-wrap:anywhere}
.pill{display:inline-block;font-size:.8rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:2px 10px;color:var(--on-color);margin-right:8px}
.pill.bad{background:var(--red)}.pill.ok{background:var(--green)}
.list{list-style:none;padding:0;margin:0 0 16px;display:flex;flex-direction:column;gap:8px}
.list li{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;overflow-wrap:anywhere}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.bar .inner{max-width:560px;margin-inline:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.bar button{min-height:56px;padding:8px 6px;font-size:.95rem}
.note{font-size:.95rem;color:var(--muted)}
.list li.item{display:flex;align-items:center;justify-content:space-between;gap:10px}
.list li.item span{min-width:0;flex:1}
.list li.item button{min-height:46px;padding:6px 14px;flex:0 0 auto}
select{font:inherit;width:100%;min-height:58px;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--fg)}
.fld{margin-bottom:14px}
.gsvg{display:block;width:100%;max-width:380px;height:auto;margin:6px auto 10px}
.gsvg text{fill:var(--fg);font-family:var(--font)}
.warn{border-left:6px solid var(--orange);padding-left:12px}
@media (prefers-reduced-motion:no-preference){button{transition:filter .12s}button:active{filter:brightness(.9)}}
</style>
<main id="app" aria-live="polite"></main>
<script>
(function(){
'use strict';
var KEY='juniorBudget.v1';
var FREQ=[{k:'week',label:'Every week',mult:52/12},{k:'2week',label:'Every 2 weeks',mult:26/12},{k:'semi',label:'Twice a month',mult:2},{k:'month',label:'Once a month',mult:1}];
var CATS=[['Rent or room','What you pay to live where you live.'],['Food and groceries','Groceries and eating out.'],['Electric','Your electric bill.'],['Gas (home)','Natural gas or propane for heating, hot water or cooking. Car gas comes later.'],['Water','Your water and sewer bill.'],['Trash','Trash and garbage pickup.'],['Phone','Your phone bill.'],['Internet','Your home internet bill.'],['Cable or streaming','Cable TV and streaming services.'],['Getting around','Bus, rides, parking, bike or scooter costs. Car costs come next.'],['Car gas','Gas or fuel for your car.'],['Car insurance','Your car insurance.'],['Car maintenance','Oil changes, tires, repairs, registration.'],['Fun','Movies, games, hanging out.'],['Savings','Money you put away on purpose.'],['Other','Anything else you pay for each month.']];

function isCar(i){return CARS.indexOf(CATS[i][0])>=0;}
function carStart(){for(var i=0;i<CATS.length;i++)if(CATS[i][0]===CARS[0])return i;return -1;}
var DTYPES=['Credit card','Car loan','Student loan','Other loan'];
var SLICE=['var(--s1)','var(--s2)','var(--s3)','var(--s4)','var(--s5)','var(--s6)','var(--s7)','var(--s8)'];

/* ---------- helpers ---------- */
var app=document.getElementById('app');

  Object.keys(attrs).forEach(function(k){var v=attrs[k];if(v==null||v===false)return;
    if(k==='class')e.className=v;else if(k==='text')e.textContent=v;else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),v);else e.setAttribute(k,v===true?'':v);});
  for(var i=2;i<arguments.length;i++)add(e,arguments[i]);return e;}

var NS='http://www.w3.org/2000/svg';
function sv(tag,attrs){var e=document.createElementNS(NS,tag);Object.keys(attrs||{}).forEach(function(k){e.setAttribute(k,attrs[k])});for(var i=2;i<arguments.length;i++)if(arguments[i])e.append(arguments[i]);return e;}
function money(x){return (x||0).toLocaleString('en-US',{style:'currency',currency:'USD'});}
function parseNum(s){s=String(s).replace(/[$,%\s]/g,'');if(s==='')return null;var v=Number(s);return (isFinite(v)&&v>=0&&v<=1e9)?v:null;}
function uid(){return 'b'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function num(v){v=Number(v);return (isFinite(v)&&v>=0&&v<=1e9)?v:0;}
function str(v,n){return typeof v==='string'?v.slice(0,n):'';}
function freqOf(k){for(var i=0;i<FREQ.length;i++)if(FREQ[i].k===k)return FREQ[i];return FREQ[3];}
function clone(o){return JSON.parse(JSON.stringify(o));}
function monthsText(m){if(m>1200)return 'more than 100 years';var y=Math.floor(m/12),mo=m%12;
  function pl(n,w){return n+' '+w+(n===1?'':'s');}
  if(y===0)return pl(m,'month');if(mo===0)return pl(y,'year');return pl(y,'year')+', '+pl(mo,'month');}

/* ---------- data ---------- */
function blank(name){return {hasCar:null,tax:null,spent:[],id:uid(),name:name||'',created:new Date().toISOString().slice(0,10),incomes:[],
  expenses:CATS.map(function(c){return {name:c[0],amount:0};}),extras:[],debts:[]};}
function clean(b){

  out.hasCar=(b.hasCar===true||b.hasCar===false)?b.hasCar:null;out.id=str(b.id,40)||out.id;out.created=str(b.created,20)||out.created;
  out.incomes=arr(b.incomes).map(function(i){i=i||{};return {name:str(i.name,60),freq:freqOf(i.freq).k,amount:num(i.amount),gross:num(i.gross),stubDate:str(i.stubDate,10)};});
  var ex=arr(b.expenses);
  out.expenses=CATS.map(function(c){var f=ex.filter(function(e){return e&&e.name===c[0];})[0];return {name:c[0],amount:f?num(f.amount):0};});
  out.extras=arr(b.extras).map(function(e){e=e||{};return {name:str(e.name,60),amount:num(e.amount)};});
  out.debts=arr(b.debts).map(function(d){d=d||{};return {type:(DTYPES.indexOf(d.type)>=0?d.type:'Other loan'),name:str(d.name,60),owed:num(d.owed),apr:num(d.apr),payment:num(d.payment),prepayExtra:num(d.prepayExtra),prepayLump:num(d.prepayLump),aprGuess:d.aprGuess===true};});
  var t=b.tax;out.tax=(t&&typeof t==='object')?{date:str(t.date,10),gross:num(t.gross),net:num(t.net),fedTax:num(t.fedTax),fedYtd:num(t.fedYtd),stTax:num(t.stTax),stYtd:num(t.stYtd),freq:freqOf(t.freq).k,other:num(t.other)}:null;
  out.spent=Array.isArray(b.spent)?b.spent.slice(-1000).map(function(x){x=x||{};return {date:str(x.date,10),cat:str(x.cat,60),amount:num(x.amount)};}).filter(function(x){return x.cat&&x.amount>0;}):[];
  return out;}
var db=[];var storageOk=true;
function load(){try{var r=localStorage.getItem(KEY);if(r){var o=JSON.parse(r);if(o&&Array.isArray(o.budgets))db=o.budgets.map(clean).filter(Boolean);}}catch(e){storageOk=false;}}
function save(){try{localStorage.setItem(KEY,JSON.stringify({budgets:db}));}catch(e){storageOk=false;}}
function upsert(b){var i=db.findIndex(function(x){return x.id===b.id;});if(i>=0)db[i]=b;else db.push(b);save();}

/* ---------- math ---------- */
function compute(b){
  var inc=b.incomes.reduce(function(s,i){return s+i.amount*freqOf(i.freq).mult;},0);
  var items=[];
  b.expenses.concat(b.extras).forEach(function(e){if(e.amount>0)items.push({name:e.name||'Other',amt:e.amount});});
  b.debts.forEach(function(d){if(d.payment>0)items.push({name:'Debt: '+(d.name||'debt'),amt:d.payment});});
  var exp=items.reduce(function(s,i){return s+i.amt;},0);
  return {inc:inc,exp:exp,items:items};}
function amortize(owed,apr,pay,extra,lump){
  extra=extra||0;lump=lump||0;var bal=Math.max(0,owed-lump);
  if(bal<=0.005)return {months:0,interest:0};
  var r=apr/1200,p=pay+extra;if(p<=0)return null;var tot=0,m=0;
  while(bal>0.005){var i=bal*r;if(p<=i+1e-9)return null;tot+=i;bal-=Math.min(p-i,bal);m++;if(m>1200)return null;}
  return {months:m,interest:tot};}
function debtNote(d){
  if(d.owed<=0)return {tone:'ok',text:(d.name||'Debt')+': nothing owed.'};
  var head=(d.name||'Debt')+': you owe '+money(d.owed)+'. ';
  if(d.payment<=0)return {tone:'bad',text:head+'No monthly payment is set, so this will not go away.'};
  var a=amortize(d.owed,d.apr,d.payment);
  var est=d.aprGuess?' The interest rate ('+d.apr+'%) is an estimate. Check your statement and change it.':'';
  if(!a){var int=d.owed*d.apr/1200;return {tone:'bad',text:head+'Your payment of '+money(d.payment)+' does not even cover the interest (about '+money(int)+' a month). The debt will never shrink. Pay more than '+money(int)+' a month.'+est};}
  return {tone:'ok',text:head+'At '+money(d.payment)+' a month, paid off in about '+monthsText(a.months)+(d.apr>0?'. You will pay about '+money(a.interest)+' in interest.':'.')+est};}

/* ---------- navigation ---------- */
var cur=null,mode='new',hist=[],view=null,editSnap=null,draft={};
function show(v){view=v;app.textContent='';v[0](v[1]);window.scrollTo(0,0);}
function go(fn,arg){if(view)hist.push(view);show([fn,arg]);}
function back(){var p=hist.pop();if(!p){home();return;}show(p);}
function jump(fn,arg){hist=[];show([fn,arg]);}
function baseFor(moreFn){var t=hist[hist.length-1];return (t&&t[0]===moreFn)?hist.length-1:hist.length;}
function finishItem(moreFn,base){hist.length=base;show([moreFn]);}

/* ---------- screen building blocks ---------- */
function ask(o){
  var err=h('div',{class:'err',role:'alert'});
  var input=o.input;
  var form=h('form',{class:'card',onsubmit:function(ev){ev.preventDefault();var r=o.onNext(input?input.value:null);if(r){err.textContent=r;if(input)input.focus();}}},
    o.eyebrow?h('p',{class:'eyebrow',text:o.eyebrow}):null,
    h('h2',{text:o.title}),o.hint?h('p',{class:'hint',text:o.hint}):null,
    input?h('label',{for:input.id,class:'hint',text:o.label||''}):null,input,err,
    o.guess?h('div',{},h('button',{type:'button',class:'ghost',onclick:o.guess.fn,text:"I don't know the rate"}),h('p',{class:'hint',text:"I will use "+o.guess.rate+"% as a stand-in. You can change it later."})):null,
    h('div',{class:'row'},h('button',{type:'button',class:'ghost',onclick:back,text:'Back'}),h('button',{type:'submit',text:o.nextLabel||'Next'})));
  app.append(form);if(input)setTimeout(function(){input.focus();},30);}
function textIn(id,val,ph){return h('input',{type:'text',id:id,value:val||'',placeholder:ph||'',autocomplete:'off',maxlength:'60'});}
function numIn(id,val,ph){var i=h('input',{type:'text',inputmode:'decimal',id:id,placeholder:ph||'0',autocomplete:'off'});if(val!=null&&val!=='')i.value=String(Math.round(val*100)/100);return i;}

/* ---------- editing and sense checks ---------- */
function rowEl(text,onEdit){return h('li',{class:'item'},h('span',{text:text}),h('button',{class:'ghost',type:'button',onclick:onEdit,'aria-label':'Edit '+text,text:'Edit'}));}
function editItem(o){
  var err=h('div',{class:'err',role:'alert'});var inputs={};
  var form=h('form',{class:'card',onsubmit:function(ev){ev.preventDefault();var vals={};
    for(var i=0;i<o.fields.length;i++){var f=o.fields[i],raw=inputs[f.key].value;
      if(f.kind==='text'){raw=raw.trim();if(!raw){err.textContent='Please fill in '+f.label.toLowerCase()+'.';inputs[f.key].focus();return;}vals[f.key]=raw.slice(0,60);}
      else if(f.kind==='freq'){vals[f.key]=raw;}
      else{var n=parseNum(raw===''&&f.allowBlank?'0':raw);if(n===null||(f.max&&n>f.max)){err.textContent='Type just numbers for '+f.label.toLowerCase()+', like 50 or 50.50.';inputs[f.key].focus();return;}if(f.positive&&n<=0){err.textContent='You have a car, so this needs an amount above $0.';inputs[f.key].focus();return;}vals[f.key]=n;}}
    var c=o.check?o.check(vals):null;
    if(c)go(confirmScreen,dupOpts(c,function(){o.apply(vals);hist.pop();back();},function(){if(o.skip)o.skip();hist.pop();back();}));
    else{o.apply(vals);back();}}},
    h('p',{class:'eyebrow',text:o.eyebrow||'Change'}),h('h2',{text:o.title}),o.hint?h('p',{class:'hint',text:o.hint}):null,
    o.fields.map(function(f,idx){var inp;
      if(f.kind==='text')inp=textIn('e-'+f.key,f.value);
      else if(f.kind==='freq'){inp=h('select',{id:'e-'+f.key},FREQ.map(function(q){return h('option',{value:q.k,selected:q.k===f.value,text:q.label});}));}
      else inp=numIn('e-'+f.key,f.value);
      inputs[f.key]=inp;return h('div',{class:'fld'},h('label',{for:'e-'+f.key,text:f.label}),inp);}),
    err,h('div',{class:'row'},h('button',{type:'button',class:'ghost',onclick:back,text:'Cancel'}),h('button',{type:'submit',text:'Save'})));
  app.append(form);}
function confirmScreen(o){
  app.append(h('div',{class:'card'},h('p',{class:'eyebrow',text:'Check'}),h('h2',{text:'Does this look right?'}),h('p',{text:o.text}),
    o.warn?h('p',{class:'warn',text:o.warn}):null,
    h('div',{class:'stack'},o.same?h('button',{class:'green',onclick:o.same,text:o.sameLabel}):null,h('button',{class:o.same?'':'green',onclick:o.yes,text:o.yesLabel||"Yes, that's right"}),h('button',{class:'ghost',onclick:back,text:'No, let me fix it'}))));}
function dupOpts(c,yesFn,skipFn){var o={text:c.text,warn:c.warn,yesLabel:c.yesLabel,yes:yesFn};
  if(c.sameLabel){o.sameLabel=c.sameLabel;o.same=function(){if(c.sameDo)c.sameDo();(c.skip?skipFn:yesFn)();};}
  return o;}
function jobLimit(name){var n=String(name||'').toLowerCase();
  if(/bus/.test(n)&&/(assistant|aide|monitor|attendant)/.test(n))return {label:'an assistant bus driver',max:40000,note:'about $40,000 a year'};
  if(/bus\s*driver/.test(n))return {label:'a bus driver',max:29*2080,note:'about $29 an hour, or '+money(29*2080)+' a year'};
  return null;}
function incomeCheck(it){
  var f=freqOf(it.freq),yr=it.amount*f.mult*12,gy=(it.gross>0?it.gross:it.amount)*f.mult*12;var lim=jobLimit(it.name);
  var t=money(it.amount)+' '+f.label.toLowerCase()+' adds up to about '+money(yr)+' a year take-home'+(it.gross>0?' ('+money(gy)+' before taxes)':'')+'.';
  var ws=[];
  if(lim&&gy>lim.max)ws.push('That is more than '+lim.label+' usually makes ('+lim.note+'). Check the amount, and check that you picked how often you are paid correctly.');
  if(it.gross>0){
    if(it.amount>it.gross)ws.push('Take-home pay is more than gross pay. Take-home is the smaller number, after taxes.');
    else if(it.amount<it.gross*0.6)ws.push('Take-home is less than 60% of gross pay. Check both numbers on the stub.');}
  if(it.stubFreq&&it.stubFreq!==it.freq)ws.push('Your stub says '+freqOf(it.stubFreq).label.toLowerCase()+' but you picked '+freqOf(it.freq).label.toLowerCase()+'. One of them is wrong.');
  if(it.stubDate){var dd=new Date(it.stubDate+'T12:00:00'),days=(Date.now()-dd.getTime())/864e5;
    if(days>45)ws.push('This stub is more than 6 weeks old. Use your most recent one if you have it.');
    else if(days<-1)ws.push('The stub date is in the future. Check the date.');}
  return {text:t,warn:ws.length?ws.join(' '):null};}
function vehicleLike(t){return /(\bcar\b|auto|truck|vehicle|\bsuv\b)/i.test(t||'');}
function payLike(t){return /(payment|loan|note|lease|financ|installment|credit card|\bcard\b|debt)/i.test(t||'');}
function normName(t){return String(t||'').toLowerCase().replace(/[^a-z0-9]/g,'');}
function sameThing(expName,d){
  if(!expName)return false;
  if(normName(expName)&&normName(expName)===normName(d.name))return true;
  if(!payLike(expName))return false;
  var dn=(d.name||'')+' '+(d.type||'');
  return (vehicleLike(expName)&&vehicleLike(dn))||(/card/i.test(expName)&&/card/i.test(dn))||(/student/i.test(expName)&&/student/i.test(dn));}

      if(ih>0)svg.append(sv('rect',{x:c-bw/2,y:base-ph-ih,width:bw,height:ih,style:'fill:var(--red)'}));
      if(ph>=24)svg.append(tx(c,base-ph/2+5,money(d.owed),15,'fill:var(--on-orange)',true));
      if(ih>=24)svg.append(tx(c,base-ph-ih/2+5,money(x.s.interest),15,'fill:#ffffff',true));
      svg.append(tx(c,base-ph-ih-8,money(tot)+' total',16,'',true));
      svg.append(tx(c,base+22,x.name,16,'',true));
      svg.append(tx(c,base+42,monthsText(x.s.months),14,'fill:var(--muted)',false));});
    svg.append(sv('line',{x1:10,y1:base,x2:330,y2:base,style:'stroke:var(--muted);stroke-width:2'}));

      h('li',{},h('span',{class:'sw',style:'background:var(--red)'}),h('span',{class:'nm',text:'Red = interest, the extra cost of borrowing'}),h('span',{text:''}))));
    app.append(card);}
  app.append(h('div',{class:'stack'},
    h('button',{onclick:function(){go(editItem,{eyebrow:'Prepay',title:'Try a prepay',hint:'Extra money on top of your normal payment of '+money(d.payment)+', and/or one payment today. Type 0 for none.',
      fields:[{key:'extra',label:'Extra every month',kind:'num',value:d.prepayExtra||'',allowBlank:true},{key:'lump',label:'Pay some now (one time)',kind:'num',value:d.prepayLump||'',allowBlank:true}],
      apply:function(v){d.prepayExtra=v.extra;d.prepayLump=v.lump;upsert(cur);}});},text:'Try a prepay'}),
    sc.has?h('button',{class:'ghost',onclick:function(){d.prepayExtra=0;d.prepayLump=0;upsert(cur);show([debtGraph,i]);},text:'Clear prepay'}):null,
    h('button',{class:'ghost',onclick:back,text:'Back'})));}

/* ---------- backup ---------- */
function backupJson(){return JSON.stringify({app:'JuniorBudget',version:1,saved:new Date().toISOString(),budgets:db},null,2);}
function backupScreen(){
  hist=[];view=[backupScreen];app.textContent='';
  var status=h('p',{class:'note',role:'status'});
  var out=h('textarea',{id:'f-out',readonly:true,'aria-label':'Backup text'});out.value=backupJson();
  var inp=h('textarea',{id:'f-in','aria-label':'Paste a backup here',placeholder:'Paste a backup here'});
  var file=h('input',{type:'file',id:'f-file',accept:'.json,application/json,text/plain'});
  function loadText(t){try{var o=JSON.parse(t);var list=Array.isArray(o)?o:(o&&Array.isArray(o.budgets)?o.budgets:(o&&o.incomes?[o]:null));
      if(!list)throw new Error('x');var n=0;list.forEach(function(b){var c=clean(b);if(c){upsert(c);n++;}});
      out.value=backupJson();status.textContent=n?('Loaded '+n+' budget'+(n===1?'':'s')+'.'):'That backup had no budgets in it.';}
    catch(e){status.textContent='That does not look like a Junior\'s Budget backup.';}}
  file.addEventListener('change',function(){var f=file.files&&file.files[0];if(!f)return;var rd=new FileReader();rd.onload=function(){loadText(String(rd.result));};rd.readAsText(f);});
  app.append(h('h1',{text:'Backups'}),h('p',{class:'hint',text:'A backup is a copy of all your budgets. Keep one safe in case this phone clears its data.'}),
    h('div',{class:'card'},h('h2',{text:'Save a backup'}),
      h('div',{class:'stack'},
        h('button',{onclick:function(){try{var bl=new Blob([backupJson()],{type:'application/json'});var u=URL.createObjectURL(bl);var a=document.createElement('a');a.href=u;a.download='juniors-budget-backup.json';document.body.append(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u);},2000);status.textContent='If a file did not download, use Copy backup text instead.';}catch(e){status.textContent='Download is blocked here. Use Copy backup text instead.';}},text:'Save a file to my phone'}),
        h('button',{class:'ghost',onclick:function(){out.focus();out.select();var done=function(){status.textContent='Copied. Paste it into the Notes app to keep it.';};
          if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(out.value).then(done,function(){status.textContent='Text is selected. Tap Copy in the pop-up.';});}else{status.textContent='Text is selected. Tap Copy in the pop-up.';}},text:'Copy backup text'}),
        out)),
    h('div',{class:'card'},h('h2',{text:'Load a backup'}),
      h('div',{class:'stack'},h('label',{for:'f-file',text:'Choose a backup file'}),file,inp,
        h('button',{onclick:function(){if(inp.value.trim())loadText(inp.value);else status.textContent='Paste a backup first, or choose a file.';},text:'Load pasted backup'}))),
    status,h('button',{class:'ghost',style:'width:100%',onclick:home,text:'Back to my budgets'}));}

load();home();
})();
